services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gateflow
      POSTGRES_USER: gateflow
      POSTGRES_PASSWORD: gateflow-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateflow -d gateflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-upstream:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/usr/local/bin/mock-upstream"]
    environment:
      MOCK_UPSTREAM_PORT: 9090
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:-postgres://gateflow:gateflow-local-password@postgres:5432/gateflow?sslmode=disable}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-gateflow-ai-local-internal}
      ANOMALY_MODEL_PATH: /app/models/active
    volumes:
      - ai-models:/app/models
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-gateflow-local-admin}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-gateflow-ai-local-internal}
      AI_SERVICE_TIMEOUT_MS: 8000
      SEED_API_KEY: ${SEED_API_KEY:-gf_local_demo_key}
      DATABASE_URL: postgres://gateflow:gateflow-local-password@postgres:5432/gateflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MOCK_UPSTREAM_URL: http://mock-upstream:9090
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
  ai-models:
